name: release

# Push a tag like v0.2.0 to build and publish Trimple.exe on the Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Test
        run: go test ./...
      - name: Build Windows executables
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/Trimple-windows-$arch.exe ./cmd/trimple
          done
          cp dist/Trimple-windows-amd64.exe dist/Trimple.exe
          cd dist && sha256sum *.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Trimple $GITHUB_REF_NAME" --generate-notes
